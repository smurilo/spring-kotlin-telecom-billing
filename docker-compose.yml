services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: billing, POSTGRES_USER: billing, POSTGRES_PASSWORD: billing }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U billing"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { postgres: { condition: service_healthy } }
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/billing" }
    ports: [ "8080:8080" ]
